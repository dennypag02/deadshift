# DeadShift – asset batch: OUTSKIRTS WORLD ART
# Buildings, structures, objective props, ground decals, ground textures.
# Merge into assets.yaml the same way as the enemies/icons batch (see ASSET_BATCH_HANDOFF.md):
#   - add the new categories only if they don't already exist
#   - skip duplicate names and tell me
# Style must match OUTSKIRTS_ART_TARGET.png: flat vector, bold dark outlines, light from top-left,
# muted rust / olive / dusty gray palette. No red anywhere (red = survivor only).
# Amber glow on interactables is added IN CODE, not painted into the art.
#
# IMPORTANT: building/structure `target` sizes come from the original gray-box spec.
# Before generating, the agent must measure the CURRENT footprint of each building/collision shape
# in the Outskirts scene and update `target` to match (1 tile = 128 px). Report any changes.

categories:
  decals:
    workflow: sprite
    size: [1024, 1024]
    target: {long_side: 384}
    count: 4
    style: "(flat vector illustration:1.3), 2D game decal, (top-down view:1.6), seen from directly above, flat on the ground, irregular organic shape, soft natural edges, cel shaded, muted palette, (isolated on plain white background:1.4)"
    negative: "photograph, photorealistic, 3D render, side view, perspective, square, rectangle, circle, perfect geometric shape, border, frame, objects, people, characters, text, watermark, blurry, red"

  textures:
    workflow: texture          # NEW: no background removal; run the seamless/tileable post-process instead
    size: [1024, 1024]
    target: {width: 256, height: 256}
    count: 4
    tileable: true
    style: "(flat vector illustration:1.2), seamless tileable texture, seen from directly above, flat even lighting, no shadows, cel shaded, muted palette of rust brown, olive green and dusty gray"
    negative: "photograph, photorealistic, 3D render, perspective, horizon, objects, cars, people, characters, border, frame, vignette, text, watermark, blurry, seams, red"

