name: Apply validated feedback source
on:
  push:
    branches: [feature/stage2-guidance-zombie-feedback]
    paths: [.github/feedback/payload.b64]
permissions:
  contents: write
concurrency:
  group: feedback-source-apply
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated text changes
        run: |
          python3 - <<'PY'
          import base64,gzip,json,subprocess
          from pathlib import Path
          data=json.loads(gzip.decompress(base64.b64decode(Path('.github/feedback/payload.b64').read_text())))
          Path('/tmp/feedback.patch').write_text(data['patch'])
          subprocess.run(['git','apply','--check','/tmp/feedback.patch'],check=True)
          subprocess.run(['git','apply','/tmp/feedback.patch'],check=True)
          for name, content in data['files'].items():
              p=Path(name)
              if p.is_absolute() or '..' in p.parts or not name.startswith(('godot/','tools/','docs/')):
                  raise ValueError('Invalid source path')
              if p.exists(): raise ValueError('Refuse replacement of new file: '+name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content)
          PY
          git fetch origin d070c9a05072436d14a826f05bfe434607ea82c7
          git checkout d070c9a05072436d14a826f05bfe434607ea82c7 -- asset_pipeline/submitted_curations asset_pipeline/submitted_artwork
          python3 tools/prepare_feedback_art.py
          python3 tools/verify_feedback_contract.py
      - name: Commit source and exact selected PNGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset -- asset_pipeline/submitted_curations asset_pipeline/submitted_artwork
          git add godot/scripts godot/shaders godot/data/phase_a.json godot/data/approved_art_receipt.json godot/art/characters godot/art/curated tools docs/STAGE2_GUIDANCE_FEEDBACK.md .github/workflows/v3-godot-android-apk.yml
          git commit -m 'Implement approved zombie presentation and Stage 2 objective guidance'
          git push origin HEAD:feature/stage2-guidance-zombie-feedback
          git rev-parse HEAD > feedback-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: feedback-source-receipt
          path: feedback-source-sha.txt
          retention-days: 7
