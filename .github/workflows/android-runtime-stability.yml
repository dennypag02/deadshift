name: Deadshift Android Runtime Stability

on:
  workflow_run:
    workflows:
      - Deadshift V3 Godot Android APK
    types:
      - completed
    branches:
      - feature/phase-a-progression

permissions:
  contents: read
  actions: read

jobs:
  android-runtime:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Download exact APK artifact
        uses: actions/download-artifact@v4
        with:
          name: deadshift-v3-godot-android-debug
          path: apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Boot emulator and run DeadShift for three minutes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euxo pipefail
            APK=$(find apk -name '*.apk' | head -1)
            test -s "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p com.dennypag02.deadshift 1
            sleep 8
            for i in $(seq 1 18); do
              adb shell input tap 540 650 || true
              sleep 10
            done
            adb logcat -d > crash.log
            adb shell pidof com.dennypag02.deadshift > deadshift.pid
            test -s deadshift.pid
            grep "ANDROID_RUNTIME" crash.log > android-runtime.log || true
            test -s android-runtime.log
            if grep -Eiq 'FATAL EXCEPTION|AndroidRuntime.*FATAL|SIGSEGV|Fatal signal|Out of memory|OutOfMemoryError' crash.log; then
              echo "Android fatal signature detected"
              grep -Ein 'FATAL EXCEPTION|AndroidRuntime|SIGSEGV|Fatal signal|Out of memory|OutOfMemoryError' crash.log | tail -80
              exit 1
            fi
            python3 - <<'PY'
            import re
            text=open('android-runtime.log',encoding='utf-8',errors='ignore').read()
            fps=[int(x) for x in re.findall(r'fps=(\d+)', text)]
            enemies=[int(x) for x in re.findall(r'enemies=(\d+)', text)]
            if not fps or not enemies:
                raise SystemExit('missing Android runtime telemetry')
            print(f'ANDROID_STABILITY_PASS samples={len(fps)} fps_min={min(fps)} fps_avg={sum(fps)/len(fps):.1f} enemies_max={max(enemies)}')
            if max(enemies) < 40:
                raise SystemExit(f'dense horde not reached; enemies_max={max(enemies)}')
            PY

      - name: Upload Android runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadshift-android-runtime-stability
          path: |
            crash.log
            android-runtime.log
            deadshift.pid
          if-no-files-found: warn
