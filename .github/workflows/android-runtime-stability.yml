name: Deadshift Android Emulator Stability

on:
  push:
    branches:
      - feature/phase-a-progression
    paths:
      - 'godot/**'
      - '.github/workflows/android-runtime-stability.yml'
      - 'scripts/android_stability.sh'

permissions:
  contents: read

jobs:
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: RUNNING - enable hardware acceleration on this temporary runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-stability
          echo "RUNNING - Android stability $GITHUB_RUN_ID, source $GITHUB_SHA" | tee android-stability/status.txt
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 0600 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm | tee android-stability/kvm.txt
          echo 'MILESTONE - KVM available to the current temporary CI user only.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d templates-unpacked
          cp templates-unpacked/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          cp "$GITHUB_WORKSPACE/.github/android/deadshift-dev.keystore" "$HOME/.android/debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot editor Android export settings
        shell: bash
        run: |
          set -euo pipefail
          cat > godot/configure_android_export.gd <<'GDSCRIPT'
          extends SceneTree
          func _initialize() -> void:
              var settings := EditorInterface.get_editor_settings()
              settings.set_setting("export/android/android_sdk_path", OS.get_environment("ANDROID_HOME"))
              settings.set_setting("export/android/java_sdk_path", OS.get_environment("JAVA_HOME"))
              settings.set_setting("export/android/debug_keystore", OS.get_environment("GODOT_ANDROID_KEYSTORE_DEBUG_PATH"))
              settings.set_setting("export/android/debug_keystore_user", "androiddebugkey")
              settings.set_setting("export/android/debug_keystore_pass", "android")
              quit()
          GDSCRIPT
          timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --quit --path godot --script res://configure_android_export.gd
          rm godot/configure_android_export.gd

      - name: Import project
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --editor --quit

      - name: Export guarded APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --verbose --path godot --export-debug Android "$GITHUB_WORKSPACE/build/deadshift-v3-debug.apk"
          test -s build/deadshift-v3-debug.apk
          unzip -l build/deadshift-v3-debug.apk > apk-contents.txt
          grep -q "assets/data/phase_a.json" apk-contents.txt
          grep -q "gameplay_config_fallback.gd" apk-contents.txt || grep -q "gameplay_config_fallback.gdc" apk-contents.txt

      - name: Three-minute Android logcat stability test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 180
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: |
            "$ANDROID_HOME/emulator/emulator" -accel-check | tee android-stability/acceleration.txt
            bash scripts/android_stability.sh

      - name: Upload Android stability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadshift-android-emulator-stability
          path: |
            build/deadshift-v3-debug.apk
            android-stability/**
            apk-contents.txt
          if-no-files-found: warn

      - name: COMPLETE or FAILED - Android validation outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          state=FAILED
          if [ "$RESULT" = success ]; then state=COMPLETE; fi
          echo "$state - Android stability run $GITHUB_RUN_ID: $RESULT; source $GITHUB_SHA. Emulator evidence is not physical phone acceptance." | tee -a "$GITHUB_STEP_SUMMARY"
