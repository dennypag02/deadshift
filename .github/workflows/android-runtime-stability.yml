name: Deadshift Android Emulator Stability

on:
  push:
    branches:
      - feature/phase-a-progression
    paths:
      - 'godot/**'
      - '.github/workflows/android-runtime-stability.yml'

permissions:
  contents: read

jobs:
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d templates-unpacked
          cp templates-unpacked/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          cp "$GITHUB_WORKSPACE/.github/android/deadshift-dev.keystore" "$HOME/.android/debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot editor Android export settings
        shell: bash
        run: |
          set -euo pipefail
          cat > godot/configure_android_export.gd <<'GDSCRIPT'
          extends SceneTree
          func _initialize() -> void:
              var settings := EditorInterface.get_editor_settings()
              settings.set_setting("export/android/android_sdk_path", OS.get_environment("ANDROID_HOME"))
              settings.set_setting("export/android/java_sdk_path", OS.get_environment("JAVA_HOME"))
              settings.set_setting("export/android/debug_keystore", OS.get_environment("GODOT_ANDROID_KEYSTORE_DEBUG_PATH"))
              settings.set_setting("export/android/debug_keystore_user", "androiddebugkey")
              settings.set_setting("export/android/debug_keystore_pass", "android")
              quit()
          GDSCRIPT
          timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --quit --path godot --script res://configure_android_export.gd
          rm godot/configure_android_export.gd

      - name: Import project
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --editor --quit

      - name: Export guarded APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --verbose --path godot --export-debug Android "$GITHUB_WORKSPACE/build/deadshift-v3-debug.apk"
          test -s build/deadshift-v3-debug.apk
          unzip -l build/deadshift-v3-debug.apk > apk-contents.txt
          grep -q "assets/data/phase_a.json" apk-contents.txt
          grep -q "gameplay_config_fallback.gd" apk-contents.txt || grep -q "gameplay_config_fallback.gdc" apk-contents.txt

      - name: Three-minute Android logcat stability test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euxo pipefail
            adb install -r build/deadshift-v3-debug.apk
            adb logcat -c
            adb shell monkey -p com.dennypag02.deadshift 1
            sleep 8
            for i in $(seq 1 18); do
              adb shell input tap 540 650 || true
              sleep 10
            done
            adb logcat -d > crash.log
            adb shell pidof com.dennypag02.deadshift > deadshift.pid
            test -s deadshift.pid
            grep "ANDROID_RUNTIME" crash.log > android-runtime.log || true
            test -s android-runtime.log
            if grep -Eiq 'FATAL EXCEPTION|AndroidRuntime.*FATAL|SIGSEGV|Fatal signal|Out of memory|OutOfMemoryError' crash.log; then
              echo "Android fatal signature detected"
              grep -Ein 'FATAL EXCEPTION|AndroidRuntime|SIGSEGV|Fatal signal|Out of memory|OutOfMemoryError' crash.log | tail -100
              exit 1
            fi
            python3 - <<'PY'
            import re
            text=open('android-runtime.log',encoding='utf-8',errors='ignore').read()
            fps=[int(x) for x in re.findall(r'fps=(\d+)', text)]
            enemies=[int(x) for x in re.findall(r'enemies=(\d+)', text)]
            if not fps or not enemies:
                raise SystemExit('missing Android runtime telemetry')
            print(f'ANDROID_STABILITY_PASS samples={len(fps)} fps_min={min(fps)} fps_avg={sum(fps)/len(fps):.1f} enemies_max={max(enemies)}')
            if max(enemies) < 40:
                raise SystemExit(f'dense horde not reached; enemies_max={max(enemies)}')
            PY

      - name: Upload Android stability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadshift-android-emulator-stability
          path: |
            build/deadshift-v3-debug.apk
            crash.log
            android-runtime.log
            deadshift.pid
            apk-contents.txt
          if-no-files-found: warn
