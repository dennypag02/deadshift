name: Visual Intelligence Benchmark Probe

on:
  push:
    branches:
      - feature/visual-intelligence-v1-foundation
    paths:
      - 'tools/visual_intelligence/ollama_probe.py'
      - '.github/workflows/visual-intelligence-benchmark-probe.yml'
  pull_request:
    paths:
      - 'tools/visual_intelligence/ollama_probe.py'
      - '.github/workflows/visual-intelligence-benchmark-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deadshift-gpu-exclusive
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: [self-hosted, Windows, gpu]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Locate existing real DeadShift PNG capture
        id: image
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            'C:\DeadShift-Vision-Test\test.png',
            (Join-Path $env:GITHUB_WORKSPACE 'gpu-evidence\contact-sheet.png')
          )
          $image = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $image) { throw 'No real screenshot found. Diagnostic stopped; no synthetic fallback.' }
          "image=$image" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using real screenshot at $image"
      - name: Verify runner and ComfyUI queue
        run: |
          $ErrorActionPreference = 'Stop'
          $session = (Get-Process -Id $PID).SessionId
          if ($session -eq 0) { throw 'Session 0 prohibited' }
          & nvidia-smi --query-gpu=name,memory.used,memory.total --format=csv,noheader
          if ($LASTEXITCODE -ne 0) { throw 'GPU unavailable' }
          try {
            $q = Invoke-RestMethod -Uri 'http://127.0.0.1:8188/queue' -TimeoutSec 5
          } catch { throw "Cannot verify ComfyUI idle; fail closed: $_" }
          if ($null -eq $q.queue_running -or $null -eq $q.queue_pending) { throw 'Invalid ComfyUI queue' }
          if (@($q.queue_running).Count + @($q.queue_pending).Count -ne 0) { throw 'ComfyUI busy' }
      - name: Run image-attached vision diagnostic
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/visual_intelligence/ollama_probe.py --image "${{ steps.image.outputs.image }}" --output visual-benchmark-evidence/report.json
          if ($LASTEXITCODE -ne 0) { throw 'Vision diagnostic failed' }
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-intelligence-diagnostic-${{ github.run_number }}
          path: visual-benchmark-evidence/report.json
          if-no-files-found: warn
          retention-days: 14
