name: DeadShift Curation Sync Checks
on:
  push:
    branches: [feature/automatic-curation-sync]
  pull_request:
    paths:
      - 'asset_pipeline/**'
jobs:
  sync-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML requests
      - run: python -m py_compile asset_pipeline/curation_sync.py asset_pipeline/local_worker.py
      - run: python -m unittest discover -s asset_pipeline -p 'test_curation_sync.py' -v
