name: Deadshift V3 Godot Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/v3-godot-scrolling-world
    paths:
      - 'godot/**'
      - '.github/workflows/v3-godot-android-apk.yml'
permissions:
  contents: read
jobs:
  export-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d templates-unpacked
          cp templates-unpacked/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Import project
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --editor --quit
      - name: Export Android debug APK
        run: |
          mkdir -p build
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --export-debug Android ../build/deadshift-v3-debug.apk
          test -s build/deadshift-v3-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadshift-v3-godot-android-debug
          path: build/deadshift-v3-debug.apk
          if-no-files-found: error
          retention-days: 14
