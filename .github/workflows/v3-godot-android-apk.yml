name: Deadshift V3 Godot Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/v3-godot-scrolling-world
      - feature/phase-a-progression
      - feature/integrate-curated-artwork-45
      - feature/stage2-guidance-zombie-feedback
      - feature/mobile-performance-pacing
      - feature/stage2-timed-events-cleanup
    paths:
      - 'godot/**'
      - '.github/workflows/v3-godot-android-apk.yml'
permissions:
  contents: read
jobs:
  export-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: RUNNING - canonical signed Stage 2 build
        run: echo "RUNNING - build $GITHUB_RUN_ID from $GITHUB_SHA; stable development signing identity retained." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d templates-unpacked
          cp templates-unpacked/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Configure Android SDK and stable debug signing
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          cp "$GITHUB_WORKSPACE/.github/android/deadshift-dev.keystore" "$HOME/.android/debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Configure Godot Android export settings
        shell: bash
        run: |
          set -euo pipefail
          cat > godot/configure_android_export.gd <<'GDSCRIPT'
          extends SceneTree
          func _initialize() -> void:
              var settings := EditorInterface.get_editor_settings()
              settings.set_setting("export/android/android_sdk_path", OS.get_environment("ANDROID_HOME"))
              settings.set_setting("export/android/java_sdk_path", OS.get_environment("JAVA_HOME"))
              settings.set_setting("export/android/debug_keystore", OS.get_environment("GODOT_ANDROID_KEYSTORE_DEBUG_PATH"))
              settings.set_setting("export/android/debug_keystore_user", "androiddebugkey")
              settings.set_setting("export/android/debug_keystore_pass", "android")
              quit()
          GDSCRIPT
          timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --quit --path godot --script res://configure_android_export.gd
          rm godot/configure_android_export.gd
      - name: Stamp development version
        shell: bash
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" godot/export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.1.${GITHUB_RUN_NUMBER}\"/" godot/export_presets.cfg
      - name: Verify unchanged approved art and base combat data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 18fb452444978f09dba7c7335c4bb4ca1281d2b5
          mkdir -p build/evidence
          python3 tools/verify_mobile_contract.py | tee build/evidence/contract.log
          echo 'MILESTONE - approved artwork and base combat configuration verified; tutorial relief is isolated in stage2_events.json.' >> "$GITHUB_STEP_SUMMARY"
      - name: Strict import and all seven regression suites
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_SILENCE_ROOT_WARNING=1
          export DEADSHIFT_RUN_KIND=ci_regression
          export DEADSHIFT_EVIDENCE_DIR="$GITHUB_WORKSPACE/build/evidence/test-runs"
          G=./Godot_v4.4.1-stable_linux.x86_64
          "$G" --headless --audio-driver Dummy --path godot --editor --quit 2>&1 | tee build/evidence/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Shader compilation failed' build/evidence/import.log
          for test in stage2_tests performance_tests feedback_tests phase_a_xp_check phase_b_check survivability_ui_check hud_layout_check; do
            echo "MILESTONE - $test" >> "$GITHUB_STEP_SUMMARY"
            timeout 180s "$G" --headless --audio-driver Dummy --path godot --script "res://scripts/${test}.gd" 2>&1 | tee "build/evidence/${test}.log"
            ! grep -E 'SCRIPT ERROR|Parse Error|STAGE2_FAIL|PERFORMANCE_FAIL|FEEDBACK_FAIL' "build/evidence/${test}.log"
          done
          grep -q STAGE2_TESTS_PASS build/evidence/stage2_tests.log
          grep -q PERFORMANCE_TESTS_PASS build/evidence/performance_tests.log
          grep -q FEEDBACK_TESTS_PASS build/evidence/feedback_tests.log
      - name: Export signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --verbose --path godot --export-debug Android "$GITHUB_WORKSPACE/build/deadshift-stage2-cleanup.apk" 2>&1 | tee build/evidence/export.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Shader compilation failed' build/evidence/export.log
          test -s build/deadshift-stage2-cleanup.apk
      - name: Verify permissions and packaged runtime resources
        shell: bash
        run: |
          set -euo pipefail
          APK=build/deadshift-stage2-cleanup.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$APK" | tee build/evidence/manifest-permissions.txt
          grep -Fxq android.permission.VIBRATE build/evidence/manifest-permissions.txt
          unzip -l "$APK" > build/evidence/apk-contents.txt
          for resource in assets/data/phase_a.json assets/data/stage2_events.json BebasNeue-Regular.ttf BarlowCondensed-SemiBold.ttf gameplay_config_fallback actor_batch.gdshader approved_art_receipt.json actors_atlas.png actors_atlas.json pacing_telemetry stage2_events run_telemetry event_countdown; do
            grep -q "$resource" build/evidence/apk-contents.txt
          done
          for name in zombie_shambler zombie_runner zombie_spitter zombie_elite zombie_bloater zombie_brute mech_miniboss; do
            grep -q "${name}.png" build/evidence/apk-contents.txt
          done
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > build/evidence/AndroidManifest.xml
      - name: Verify APK signing and source identity
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/deadshift-stage2-cleanup.apk | tee build/evidence/apk-signature.txt
          sha256sum build/deadshift-stage2-cleanup.apk | tee build/evidence/SHA256SUMS.txt
          git rev-parse HEAD > build/evidence/source-sha.txt
          find godot/scripts godot/data godot/shaders godot/art/runtime -type f ! -name '*.uid' ! -name '*.import' -print0 | sort -z | xargs -0 sha256sum > build/evidence/runtime-source-hashes.txt
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: deadshift-stage2-cleanup-apk
          path: build/deadshift-stage2-cleanup.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadshift-stage2-cleanup-evidence
          path: build/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: COMPLETE or FAILED - final build state
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          state=FAILED
          if [ "$RESULT" = success ]; then state=COMPLETE; fi
          echo "$state - signed APK build $GITHUB_RUN_ID: $RESULT; source $GITHUB_SHA. Physical phone acceptance remains separate." | tee -a "$GITHUB_STEP_SUMMARY"
