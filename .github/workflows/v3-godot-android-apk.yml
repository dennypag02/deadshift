name: Deadshift V3 Godot Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/v3-godot-scrolling-world
      - feature/phase-a-progression
    paths:
      - 'godot/**'
      - '.github/workflows/v3-godot-android-apk.yml'
permissions:
  contents: read
jobs:
  export-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d templates-unpacked
          cp templates-unpacked/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          cp "$GITHUB_WORKSPACE/.github/android/deadshift-dev.keystore" "$HOME/.android/debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Configure Godot editor Android export settings
        shell: bash
        run: |
          set -euo pipefail
          cat > godot/configure_android_export.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
              var settings := EditorInterface.get_editor_settings()
              settings.set_setting("export/android/android_sdk_path", OS.get_environment("ANDROID_HOME"))
              settings.set_setting("export/android/java_sdk_path", OS.get_environment("JAVA_HOME"))
              settings.set_setting("export/android/debug_keystore", OS.get_environment("GODOT_ANDROID_KEYSTORE_DEBUG_PATH"))
              settings.set_setting("export/android/debug_keystore_user", "androiddebugkey")
              settings.set_setting("export/android/debug_keystore_pass", "android")
              quit()
          GDSCRIPT
          timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --quit --path godot --script res://configure_android_export.gd
          rm godot/configure_android_export.gd
      - name: Diagnose Android export prerequisites
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$HOME/.android/debug.keystore"
          test -d "$JAVA_HOME"
          echo "Installed Android SDK platforms:"
          ls -1 "$ANDROID_HOME/platforms"
          echo "Installed Android build tools:"
          ls -1 "$ANDROID_HOME/build-tools"
          echo "Godot Android export editor settings:"
          grep -A 16 -B 2 'export/android' "$HOME/.config/godot/editor_settings-4.4.tres" | sed -E 's/(debug_keystore_pass = ).*/\\1[REDACTED]/' || true
      - name: Stamp development version
        shell: bash
        run: |
          sed -i "s/^version\\/code=.*/version\\/code=${GITHUB_RUN_NUMBER}/" godot/export_presets.cfg
          sed -i "s/^version\\/name=.*/version\\/name=\\\"0.1.${GITHUB_RUN_NUMBER}\\\"/" godot/export_presets.cfg
      - name: Import project
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --editor --quit
      - name: Export Android debug APK
        run: |
          mkdir -p build
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --verbose --path godot --export-debug Android "$GITHUB_WORKSPACE/build/deadshift-v3-debug.apk"
          test -s build/deadshift-v3-debug.apk
      - name: Verify Android manifest permissions
        shell: bash
        run: |
          set -euo pipefail
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APKANALYZER"
          "$APKANALYZER" manifest permissions build/deadshift-v3-debug.apk | tee manifest-permissions.txt
          grep -Fxq "android.permission.VIBRATE" manifest-permissions.txt
      - name: Verify packaged runtime resources
        shell: bash
        run: |
          unzip -l build/deadshift-v3-debug.apk | tee apk-contents.txt
          grep -q "assets/data/phase_a.json" apk-contents.txt
          grep -q "BebasNeue-Regular.ttf" apk-contents.txt
          grep -q "BarlowCondensed-SemiBold.ttf" apk-contents.txt
          grep -q "gameplay_config_fallback.gd" apk-contents.txt || grep -q "gameplay_config_fallback.gdc" apk-contents.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadshift-v3-godot-android-debug
          path: build/deadshift-v3-debug.apk
          if-no-files-found: error
          retention-days: 14
