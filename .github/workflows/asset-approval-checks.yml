name: DeadShift Asset Approval Checks
on:
  push:
    branches:
      - feature/asset-review-approve-regenerate
  pull_request:
    paths:
      - 'asset_pipeline/**'
      - '.github/workflows/asset-approval-checks.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML requests
      - run: python -m py_compile asset_pipeline/asset_approval.py asset_pipeline/local_worker.py asset_pipeline/test_asset_approval.py
      - run: python -m unittest discover -s asset_pipeline -p 'test_asset_approval.py' -v
