name: Deadshift V3 Godot Validation
on:
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/v3-godot-validation.yml'
  push:
    branches:
      - feature/v3-godot-scrolling-world
      - feature/phase-a-progression
    paths:
      - 'godot/**'
      - '.github/workflows/v3-godot-validation.yml'
permissions:
  contents: read
jobs:
  godot-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1 headless
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Parse and import Godot project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --editor --quit 2>&1 | tee godot-import.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" godot-import.log
      - name: Run headless smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --quit-after 60 2>&1 | tee godot-smoke.log || test $? -eq 124
          ! grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|Invalid access" godot-smoke.log
      - name: Verify six shambler kills reach level 2
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://scripts/phase_a_xp_check.gd 2>&1 | tee phase-a-xp.log
          grep -q "PHASE_A_XP_6_KILL_PASS" phase-a-xp.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|PHASE_A_XP_6_KILL_FAIL" phase-a-xp.log
      - name: Verify centralized haptics
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(grep -R "Input.vibrate_handheld" godot/scripts --include='*.gd' | wc -l | tr -d ' ')
          test "$COUNT" -eq 1
          grep -q "func _haptic_pulse" godot/scripts/outskirts.gd
          grep -q 'permissions/vibrate=true' godot/export_presets.cfg
      - name: Verify Phase B milestone
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://scripts/phase_b_check.gd 2>&1 | tee phase-b.log
          grep -q "PHASE_B_CHECK_PASS" phase-b.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|PHASE_B_CHECK_FAIL" phase-b.log
      - name: Verify survivability and game over flow
        shell: bash
        run: |
          set -o pipefail
          timeout 35s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://scripts/survivability_ui_check.gd 2>&1 | tee survivability-ui.log
          grep -q "SURVIVABILITY_UI_CHECK_PASS" survivability-ui.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|SURVIVABILITY_UI_CHECK_FAIL" survivability-ui.log
      - name: Check HUD bounds at 1080x2340
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --resolution 1080x2340 --script res://scripts/hud_layout_check.gd 2>&1 | tee hud-layout.log
          grep -q "HUD_LAYOUT_1080x2340_PASS" hud-layout.log
          ! grep -E "HUD CLIPPED|SCORE OVERLAPS MINIMAP|SCRIPT ERROR:|Parse Error:" hud-layout.log
      - name: Capture 1080x2340 HUD screenshot
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri >/dev/null
          mkdir -p hud-capture
          HOME="$PWD/hud-capture" xvfb-run -a ./Godot_v4.4.1-stable_linux.x86_64 --path godot --resolution 1080x2340 --rendering-driver opengl3 --script res://scripts/hud_screenshot_check.gd 2>&1 | tee hud-screenshot.log
          find hud-capture -name 'hud_1080x2340.png' -exec cp {} hud-capture/hud.png \;
          find hud-capture -name 'levelup_1080x2340.png' -exec cp {} hud-capture/levelup.png \;
          test -s hud-capture/hud.png
          test -s hud-capture/levelup.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadshift-hud-screenshot-1080x2340
          path: |
            hud-capture/hud.png
            hud-capture/levelup.png
          if-no-files-found: warn
