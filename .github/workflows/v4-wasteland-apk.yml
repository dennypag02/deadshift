name: Deadshift V4 Wasteland 3D APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/v4-3d-wasteland-slice
permissions:
  contents: read
jobs:
  export-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d templates-unpacked
          cp -a templates-unpacked/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"
      - name: Restore persistent prototype signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: deadshift-v4-prototype-debug-signing-v1
      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Created first persistent prototype signing key"
          else
            echo "Restored existing prototype signing key"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Configure Godot editor Android export settings
        shell: bash
        run: |
          set -euo pipefail
          cat > godot3d/configure_android_export.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
              var settings := EditorInterface.get_editor_settings()
              settings.set_setting("export/android/android_sdk_path", OS.get_environment("ANDROID_HOME"))
              settings.set_setting("export/android/java_sdk_path", OS.get_environment("JAVA_HOME"))
              settings.set_setting("export/android/debug_keystore", OS.get_environment("GODOT_ANDROID_KEYSTORE_DEBUG_PATH"))
              settings.set_setting("export/android/debug_keystore_user", "androiddebugkey")
              settings.set_setting("export/android/debug_keystore_pass", "android")
              quit()
          GDSCRIPT
          timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --quit --path godot3d --script res://configure_android_export.gd
          rm godot3d/configure_android_export.gd
      - name: Diagnose Android export prerequisites
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$HOME/.android/debug.keystore"
          test -d "$JAVA_HOME"
          echo "Installed Android SDK platforms:"
          ls -1 "$ANDROID_HOME/platforms"
          echo "Installed Android build tools:"
          ls -1 "$ANDROID_HOME/build-tools"
          echo "Godot Android export editor settings:"
          grep -A 16 -B 2 'export/android' "$HOME/.config/godot/editor_settings-4.4.tres" | sed -E 's/(debug_keystore_pass = ).*/\\1[REDACTED]/' || true
      - name: Assign monotonically increasing Android version code
        shell: bash
        env:
          BUILD_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          sed -i -E "s/^version\\/code=[0-9]+$/version\\/code=${BUILD_VERSION_CODE}/" godot3d/export_presets.cfg
          grep -F "version/code=${BUILD_VERSION_CODE}" godot3d/export_presets.cfg
      - name: Import project
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot3d --editor --quit
      - name: Runtime scene smoke test
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot3d --quit-after 40 2>&1 | tee godot-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid call|Failed to load script" godot-runtime.log; then exit 1; fi
      - name: Export Android debug APK
        run: |
          mkdir -p build
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --verbose --path godot3d --export-debug Android "$GITHUB_WORKSPACE/build/deadshift-v4-wasteland-debug.apk"
          test -s build/deadshift-v4-wasteland-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/deadshift-v4-wasteland-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/deadshift-v4-wasteland-debug.apk | head -n 8
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadshift-v4-wasteland-android-debug
          path: build/deadshift-v4-wasteland-debug.apk
          if-no-files-found: error
          retention-days: 14
