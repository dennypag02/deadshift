name: DeadShift World Art V2 Checks
on:
  push:
    branches: [assets/outskirts-world-v2]
    paths: ['asset_pipeline/**', '.github/workflows/world-art-checks.yml']
  pull_request:
    branches: [feature/asset-pipeline-step1]
    paths: ['asset_pipeline/**', '.github/workflows/world-art-checks.yml']
permissions:
  contents: read
concurrency:
  group: world-art-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned current gameplay geometry (no gameplay changes)
        uses: actions/checkout@v4
        with:
          ref: 20f06d229591417315ce8506779541da527cb3f1
          path: _game_reference
          sparse-checkout: |
            godot/scripts
            godot/scenes
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing pipeline dependencies
        run: python -m pip install requests Pillow PyYAML
      - name: Capture source evidence for reproducible offline inspection
        run: |
          python - <<'PY'
          import json, pathlib, shutil, subprocess
          root = pathlib.Path('verification')
          root.mkdir(exist_ok=True)
          for raw in subprocess.check_output(['git','ls-files','asset_pipeline'], text=True).splitlines():
              source = pathlib.Path(raw)
              if source.suffix.lower() not in {'.py','.yaml','.yml','.md','.json','.txt','.bat'}:
                  continue
              target = root / 'source' / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          for source in pathlib.Path('_game_reference/godot/scripts').glob('*.gd'):
              target = root / 'source' / 'game_reference' / source.name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          (root / 'source_revisions.json').write_text(json.dumps({
              'pipeline_sha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'gameplay_sha': subprocess.check_output(['git','-C','_game_reference','rev-parse','HEAD'],text=True).strip(),
              'generation_started': False, 'approved_art_changed': False
          }, indent=2)+'\n')
          PY
      - name: Existing pipeline regression tests
        run: |
          set -o pipefail
          python -m unittest discover -s asset_pipeline -p 'test_*.py' -v 2>&1 | tee verification/unit-tests.log
      - name: Offline generation plan (queues no images)
        run: |
          set -o pipefail
          python asset_pipeline/generate.py --dry-run 2>&1 | tee verification/generator-dry-run.log
          if test -f asset_pipeline/world_batch.py; then
            python asset_pipeline/world_batch.py --dry-run --game-source _game_reference/godot/scripts/outskirts.gd --report verification/world-audit.json 2>&1 | tee verification/world-audit.log
          fi
      - name: Publish audit and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-art-v2-verification-${{ github.sha }}
          path: verification/
          if-no-files-found: error
          retention-days: 14
